fe Tür 46 x 28 cm (Öffnung 40 x 22.4,</text><text x="10.00" y="153.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">Überdeckung 3 cm seitlich, 2.8 cm oben/unten). Griff mit 2 Schrauben M4 + 3-cm-Holzklotz</text><text x="10.00" y="157.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">als Abstand mittig anschrauben. Aussen 2 x Thermolack. Tür lehnt vor der Tunnelöffnung.</text><rect x="175.00" y="140.00" width="2.00" height="44.80" fill="#555" stroke="#333" stroke-width="0.3" /><rect x="177.00" y="140.00" width="2.40" height="0.80" fill="#555" stroke="#222" stroke-width="0.35" /><rect x="177.00" y="184.00" width="2.40" height="0.80" fill="#555" stroke="#222" stroke-width="0.35" /><rect x="170.20" y="158.00" width="4.80" height="9.00" fill="#c9a26b" stroke="#7a5523" stroke-width="0.3" /><rect x="165.50" y="154.00" width="4.70" height="17.00" fill="#d8b47c" stroke="#7a5523" stroke-width="0.3" /><text x="163.00" y="180.00" font-size="2.3" text-anchor="end" fill="#7a5523" font-weight="normal">Griff + Holzklotz</text><text x="181.00" y="188.00" font-size="2.3" text-anchor="start" fill="#333" font-weight="normal">Seitenansicht</text><text x="5.00" y="6.00" font-size="4.4" text-anchor="start" fill="#222" font-weight="bold">TÜR UND KAMINABDECKUNG  1:5 / Zuschnitt 1:10</text><text x="5.00" y="11.20" font-size="2.8" text-anchor="start" fill="#555" font-weight="normal">aus dem Glattblech 500 x 1000 x 0.75 mm (OBI 4983821)</text></svg>