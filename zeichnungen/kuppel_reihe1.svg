0" y="35.00" font-size="2.4" text-anchor="start" fill="#555" font-weight="bold">oben breit</text><text x="186.00" y="41.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">R1</text><text x="200.00" y="41.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">0–12.1</text><text x="222.00" y="41.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">40 → 37.7</text><text x="244.00" y="41.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">11°</text><text x="262.00" y="41.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">16 + Tür</text><text x="288.00" y="41.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">12.5</text><text x="186.00" y="47.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">R2</text><text x="200.00" y="47.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">12.5–22.9</text><text x="222.00" y="47.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">37.5 → 30.9</text><text x="244.00" y="47.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">33°</text><text x="262.00" y="47.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">15 + Tür</text><text x="288.00" y="47.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">9.7</text><text x="186.00" y="53.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">R3</text><text x="200.00" y="53.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">23.2–30.7</text><text x="222.00" y="53.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">30.6 → 20.8</text><text x="244.00" y="53.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">52°</text><text x="262.00" y="53.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">15</text><text x="288.00" y="53.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">8.4</text><text x="186.00" y="59.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">R4</text><text x="200.00" y="59.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">30.9–35.1</text><text x="222.00" y="59.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">20.5 → 8.9</text><text x="244.00" y="59.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">70°</text><text x="262.00" y="59.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">10</text><text x="288.00" y="59.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">5.3</text><text x="186.00" y="65.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="bold">Schluss: 4 Viertelkreis-Stücke, Restöffnung Ø ca. 17</text><text x="186.00" y="70.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="bold">Total 60 Halbsteine</text><text x="186.00" y="81.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">Reihenfolge je Reihe:</text><text x="186.00" y="85.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">1. Steine 1 und 2 hinten (gegenüber der Tür),</text><text x="186.00" y="89.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">2. dann abwechselnd links/rechts nach vorne,</text><text x="186.00" y="93.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">3. die letzten zwei stossen an die Tunnelwände:</text><text x="186.00" y="97.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">   bei Bedarf schmaler schneiden.</text><text x="186.00" y="101.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">Stossfugen gegenüber der Reihe darunter</text><text x="186.00" y="105.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">um eine halbe Steinbreite versetzen.</text><text x="186.00" y="109.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">Fuge innen 3–4 mm, aussen keilförmig voll.</text><text x="186.00" y="113.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">«oben breit»: Breite an der Oberkante innen,</text><text x="186.00" y="117.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">Steine keilförmig zuschneiden (Z13 ④).</text></svg>