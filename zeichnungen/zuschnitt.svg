<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1340" viewBox="0 -4 255 312" font-family="DejaVu Sans, Arial, sans-serif"><title>Zuschnitt</title><defs>
<pattern id="pKies" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#d8cfb8"/><circle cx="1" cy="1" r="0.55" fill="#8f8060"/><circle cx="3" cy="2.8" r="0.7" fill="#a8977a"/></pattern>
<pattern id="pBeton" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#c9cdd2"/><circle cx="1.5" cy="2" r="0.35" fill="#7d838b"/><circle cx="4.3" cy="4.5" r="0.5" fill="#8c929a"/><path d="M3.5 1 l0.7 0.6 l-0.9 0.2z" fill="#7d838b"/></pattern>
<pattern id="pSchal" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#b9bfc6"/><line x1="0" y1="0" x2="0" y2="5" stroke="#6d747c" stroke-width="0.5"/></pattern>
<pattern id="pPerlit" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#f3e7b3"/><circle cx="2" cy="2" r="0.45" fill="#fffaf0" stroke="#c8b46a" stroke-width="0.15"/></pattern>
<pattern id="pIso" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#f6edc9"/><circle cx="1" cy="3" r="0.4" fill="#fffaf0" stroke="#c8b46a" stroke-width="0.12"/><circle cx="3" cy="1" r="0.4" fill="#fffaf0" stroke="#c8b46a" stroke-width="0.12"/></pattern>
<pattern id="pErde" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#cdb48f"/><path d="M0 6 L6 0" stroke="#a0855f" stroke-width="0.4"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c4f8a"/></marker>
</defs><rect x="0" y="-4" width="255" height="312" fill="#ffffff"/><text x="5.00" y="18.00" font-size="3.0" text-anchor="start" fill="#222" font-weight="bold">① Schamottstein NF halbieren (35 Stück → 70 Halbsteine, gebraucht 60)</text><polygon points="10.00,40.00 60.00,40.00 60.00,52.80 10.00,52.80" fill="#d9844f" stroke="#333" stroke-width="0.35" /><polygon points="10.00,40.00 60.00,40.00 72.50,27.50 22.50,27.50" fill="#f2c4a4" stroke="#333" stroke-width="0.35" /><polygon points="60.00,40.00 72.50,27.50 72.50,40.30 60.00,52.80" fill="#b86a3c" stroke="#333" stroke-width="0.35" /><text x="35.00" y="57.80" font-size="2.5" text-anchor="middle" fill="#222" font-weight="normal">250 x 124 x 64 mm</text><line x1="35.00" y1="40.00" x2="35.00" y2="52.80" stroke="#c0392b" stroke-width="0.6" stroke-dasharray="1.5 1"/><line x1="35.00" y1="40.00" x2="41.20" y2="33.80" stroke="#c0392b" stroke-width="0.6" stroke-dasharray="1.5 1"/><text x="70.00" y="46.00" font-size="6" text-anchor="middle" fill="#555" font-weight="normal">→</text><polygon points="80.00,40.00 105.00,40.00 105.00,52.80 80.00,52.80" fill="#d9844f" stroke="#333" stroke-width="0.35" /><polygon points="80.00,40.00 105.00,40.00 117.50,27.50 92.50,27.50" fill="#f2c4a4" stroke="#333" stroke-width="0.35" /><polygon points="105.00,40.00 117.50,27.50 117.50,40.30 105.00,52.80" fill="#b86a3c" stroke="#333" stroke-width="0.35" /><polygon points="112.00,40.00 137.00,40.00 137.00,52.80 112.00,52.80" fill="#d9844f" stroke="#333" stroke-width="0.35" /><polygon points="112.00,40.00 137.00,40.00 149.50,27.50 124.50,27.50" fill="#f2c4a4" stroke="#333" stroke-width="0.35" /><polygon points="137.00,40.00 149.50,27.50 149.50,40.30 137.00,52.80" fill="#b86a3c" stroke="#333" stroke-width="0.35" /><text x="108.00" y="63.50" font-size="2.5" text-anchor="middle" fill="#222" font-weight="normal">2 x 125 x 124 x 64</text><text x="150.00" y="30.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">Schnitt quer in der Mitte (125 mm).</text><text x="150.00" y="34.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">Winkelschleifer 125 schneidet nur 33 mm tief:</text><text x="150.00" y="38.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">→ ringsum 4 Seiten anschneiden, dann mit</text><text x="150.00" y="42.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">   Gummihammer auf Kante brechen.</text><text x="150.00" y="46.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">Steine vorher 5 min wässern = weniger Staub.</text><text x="150.00" y="50.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">FFP2/FFP3, Brille, Gehörschutz, draussen, Wind</text><text x="150.00" y="54.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">im Rücken. Nie trocken in geschlossenen Räumen.</text><text x="5.00" y="85.00" font-size="3.0" text-anchor="start" fill="#222" font-weight="bold">② Schamottplatte längs halbieren (5 Platten → 10 Streifen 500 x 100 x 40)</text><polygon points="10.00,105.00 110.00,105.00 110.00,113.00 10.00,113.00" fill="#d9844f" stroke="#333" stroke-width="0.35" /><polygon points="10.00,105.00 110.00,105.00 120.00,95.00 20.00,95.00" fill="#f2c4a4" stroke="#333" stroke-width="0.35" /><polygon points="110.00,105.00 120.00,95.00 120.00,103.00 110.00,113.00" fill="#b86a3c" stroke="#333" stroke-width="0.35" /><text x="60.00" y="118.00" font-size="2.5" text-anchor="middle" fill="#222" font-weight="normal">500 x 200 x 40 mm</text><line x1="10.00" y1="109.00" x2="110.00" y2="109.00" stroke="#c0392b" stroke-width="0.6" stroke-dasharray="1.5 1"/><text x="150.00" y="98.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">Mit Bleistift + Brett als Lineal anzeichnen.</text><text x="150.00" y="102.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">40 mm dick: von oben 33 mm, dann umdrehen</text><text x="150.00" y="106.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">und von unten fertig schneiden.</text><text x="150.00" y="110.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">Schnittkante innen in den Tunnel legen,</text><text x="150.00" y="114.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">Werkskante nach aussen.</text><text x="5.00" y="145.00" font-size="3.0" text-anchor="start" fill="#222" font-weight="bold">③ Schalungsstein halbieren (1 Stück → 2 x 25 cm, Steine 6½ und 9½)</text><polygon points="10.00,165.00 60.00,165.00 60.00,190.00 10.00,190.00" fill="#cfd3d7" stroke="#333" stroke-width="0.35" /><polygon points="10.00,165.00 60.00,165.00 72.00,153.00 22.00,153.00" fill="#e6e8ea" stroke="#333" stroke-width="0.35" /><polygon points="60.00,165.00 72.00,153.00 72.00,178.00 60.00,190.00" fill="#b8bec4" stroke="#333" stroke-width="0.35" /><text x="35.00" y="195.00" font-size="2.5" text-anchor="middle" fill="#222" font-weight="normal">500 x 240 x 250 mm</text><line x1="35.00" y1="165.00" x2="35.00" y2="190.00" stroke="#c0392b" stroke-width="0.6" stroke-dasharray="1.5 1"/><text x="150.00" y="160.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">Schnitt durch den Mittelsteg.</text><text x="150.00" y="164.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">Aussenwände (ca. 3 cm) mit Diamantscheibe</text><text x="150.00" y="168.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">durchtrennen, Steg mit Hammer + Meissel brechen.</text><text x="5.00" y="207.00" font-size="3.0" text-anchor="start" fill="#222" font-weight="bold">④ Halbsteine für Reihe 2–4 keilförmig zuschneiden (Ansicht auf die Innenfläche 125 x 124)</text><rect x="12.00" y="223.20" width="25.00" height="24.80" fill="none" stroke="#999" stroke-width="0.3" stroke-dasharray="1 1"/><polygon points="12.00,248.00 37.00,248.00 34.20,223.20 14.80,223.20" fill="#d9844f" stroke="#5a2a12" stroke-width="0.45" /><text x="24.50" y="253.00" font-size="2.7" text-anchor="middle" fill="#222" font-weight="bold">R2: 15 Stück</text><text x="24.50" y="221.20" font-size="2.5" text-anchor="middle" fill="#c0392b" font-weight="normal">oben 9.7</text><text x="24.50" y="257.00" font-size="2.4" text-anchor="middle" fill="#555" font-weight="normal">je Seite 1.4 weg</text><rect x="52.00" y="223.20" width="25.00" height="24.80" fill="none" stroke="#999" stroke-width="0.3" stroke-dasharray="1 1"/><polygon points="52.00,248.00 77.00,248.00 72.90,223.20 56.10,223.20" fill="#d9844f" stroke="#5a2a12" stroke-width="0.45" /><text x="64.50" y="253.00" font-size="2.7" text-anchor="middle" fill="#222" font-weight="bold">R3: 15 Stück</text><text x="64.50" y="221.20" font-size="2.5" text-anchor="middle" fill="#c0392b" font-weight="normal">oben 8.4</text><text x="64.50" y="257.00" font-size="2.4" text-anchor="middle" fill="#555" font-weight="normal">je Seite 2 weg</text><rect x="92.00" y="223.20" width="25.00" height="24.80" fill="none" stroke="#999" stroke-width="0.3" stroke-dasharray="1 1"/><polygon points="92.00,248.00 117.00,248.00 109.80,223.20 99.20,223.20" fill="#d9844f" stroke="#5a2a12" stroke-width="0.45" /><text x="104.50" y="253.00" font-size="2.7" text-anchor="middle" fill="#222" font-weight="bold">R4: 10 Stück</text><text x="104.50" y="221.20" font-size="2.5" text-anchor="middle" fill="#c0392b" font-weight="normal">oben 5.3</text><text x="104.50" y="257.00" font-size="2.4" text-anchor="middle" fill="#555" font-weight="normal">je Seite 3.6 weg</text><text x="135.00" y="220.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">Unten bleibt die volle Breite 12.5, oben wird</text><text x="135.00" y="224.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">jede Seite schräg abgeschnitten (Bleistift-Linie</text><text x="135.00" y="228.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">von der unteren Ecke zur Marke oben).</text><text x="135.00" y="232.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">Reihe 1 braucht keinen Zuschnitt.</text><text x="135.00" y="236.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">Erst eine Reihe trocken auslegen, dann schneiden:</text><text x="135.00" y="240.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">kleine Abweichungen gleicht der Mörtel aus.</text><text x="5.00" y="268.00" font-size="2.9" text-anchor="start" fill="#222" font-weight="bold">⑤ Schluss: 4 Viertelkreise r ≈ 9 cm</text><text x="135.00" y="268.00" font-size="2.9" text-anchor="start" fill="#222" font-weight="bold">⑥ Reihe 3 über der Tür</text><path d="M 14 300 L 32.0 300 A 18.0 18.0 0 0 0 14 282.0 Z" fill="#d9844f" stroke="#5a2a12" stroke-width="0.45" /><rect x="14.00" y="275.20" width="25.00" height="24.80" fill="none" stroke="#999" stroke-width="0.3" stroke-dasharray="1 1"/><text x="48.00" y="280.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">Aus je einem Halbstein ein Viertelkreis.</text><text x="48.00" y="284.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">Die 4 Stücke trocken in die Öffnung legen,</text><text x="48.00" y="288.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">Kanten anpassen, dann mit Mörtel setzen.</text><text x="135.00" y="280.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">D1 liegt 4 cm hoch über der Türöffnung (22.4).</text><text x="135.00" y="284.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">Die Steine von Reihe 3 direkt über der Tür</text><text x="135.00" y="288.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">liegen darauf und wären sonst 3 cm zu hoch:</text><text x="135.00" y="292.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">an der Unterkante ca. 3 cm abschneiden.</text><text x="5.00" y="4.00" font-size="4.4" text-anchor="start" fill="#222" font-weight="bold">ZUSCHNITT  (Skizze, nicht massstäblich)</text></svg>