xt x="-60.00" y="-48.00" font-size="4.4" text-anchor="start" fill="#222" font-weight="bold">LAGEPLAN UND ABSTECKEN  1:25</text><text x="-60.00" y="-42.80" font-size="2.8" text-anchor="start" fill="#555" font-weight="normal">Draufsicht · Betonwand oben · alle Masse in cm</text><text x="200.00" y="20.00" font-size="2.7" text-anchor="start" fill="#222" font-weight="normal">So steckt ihr ab:</text><text x="200.00" y="24.00" font-size="2.7" text-anchor="start" fill="#222" font-weight="normal">1. Hinten ist die Wand die Kante:</text><text x="200.00" y="28.00" font-size="2.7" text-anchor="start" fill="#222" font-weight="normal">   freilegen bis an die Wand.</text><text x="200.00" y="32.00" font-size="2.7" text-anchor="start" fill="#222" font-weight="normal">2. Fundament-Hinterkante 10 cm</text><text x="200.00" y="36.00" font-size="2.7" text-anchor="start" fill="#222" font-weight="normal">   vor der Wand (Fuss der Wand</text><text x="200.00" y="40.00" font-size="2.7" text-anchor="start" fill="#222" font-weight="normal">   kann vorstehen → dort messen).</text><text x="200.00" y="44.00" font-size="2.7" text-anchor="start" fill="#222" font-weight="normal">3. Schnur links, rechts, vorne:</text><text x="200.00" y="48.00" font-size="2.7" text-anchor="start" fill="#222" font-weight="normal">   170 x 170 ab Wand.</text><text x="200.00" y="52.00" font-size="2.7" text-anchor="start" fill="#222" font-weight="normal">4. Diagonalen gleich lang</text><text x="200.00" y="56.00" font-size="2.7" text-anchor="start" fill="#222" font-weight="normal">   (240.4 cm) = rechtwinklig.</text><text x="200.00" y="60.00" font-size="2.7" text-anchor="start" fill="#222" font-weight="normal">5. Innen 150 x 150 markieren.</text><text x="200.00" y="64.00" font-size="2.7" text-anchor="start" fill="#222" font-weight="normal">6. Platten, Sand, Vlies weg;</text><text x="200.00" y="68.00" font-size="2.7" text-anchor="start" fill="#222" font-weight="normal">   Sand aufheben (Sandform).</text></svg>