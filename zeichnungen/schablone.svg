t x="96.00" y="158.64" font-size="2.4" text-anchor="middle" fill="#333" font-weight="normal">30</text><line x1="108.00" y1="150.00" x2="108.00" y2="108.17" stroke="#bbb" stroke-width="0.2" stroke-dasharray="0.8 0.8"/><circle cx="108.00" cy="108.17" r="0.80" fill="#c0392b" stroke="none" stroke-width="0.35" /><text x="108.00" y="158.64" font-size="2.4" text-anchor="middle" fill="#333" font-weight="normal">35</text><line x1="120.00" y1="150.00" x2="120.00" y2="150.00" stroke="#bbb" stroke-width="0.2" stroke-dasharray="0.8 0.8"/><circle cx="120.00" cy="150.00" r="0.80" fill="#c0392b" stroke="none" stroke-width="0.35" /><text x="120.00" y="158.64" font-size="2.4" text-anchor="middle" fill="#333" font-weight="normal">40</text><text x="72.00" y="169.20" font-size="2.6" text-anchor="middle" fill="#333" font-weight="normal">Abstand von der Achse (cm)</text><line x1="2.40" y1="150.00" x2="2.40" y2="63.60" stroke="#1c4f8a" stroke-width="0.25" marker-start="url(#arr)" marker-end="url(#arr)"/><line x1="0.40" y1="150.00" x2="4.40" y2="150.00" stroke="#1c4f8a" stroke-width="0.2" /><line x1="0.40" y1="63.60" x2="4.40" y2="63.60" stroke="#1c4f8a" stroke-width="0.2" /><text x="0.80" y="106.80" font-size="2.6" text-anchor="middle" fill="#1c4f8a" font-weight="normal" transform="rotate(-90 0.80 106.80)">36</text><text x="150.00" y="52.00" font-size="2.8" text-anchor="start" fill="#222" font-weight="normal">Höhe der Kurve über dem Boden:</text><text x="150.00" y="56.30" font-size="2.8" text-anchor="start" fill="#222" font-weight="normal">   0 cm → 36.0 cm</text><text x="150.00" y="60.60" font-size="2.8" text-anchor="start" fill="#222" font-weight="normal">   5 cm → 35.7 cm</text><text x="150.00" y="64.90" font-size="2.8" text-anchor="start" fill="#222" font-weight="normal">  10 cm → 34.9 cm</text><text x="150.00" y="69.20" font-size="2.8" text-anchor="start" fill="#222" font-weight="normal">  15 cm → 33.4 cm</text><text x="150.00" y="73.50" font-size="2.8" text-anchor="start" fill="#222" font-weight="normal">  20 cm → 31.2 cm</text><text x="150.00" y="77.80" font-size="2.8" text-anchor="start" fill="#222" font-weight="normal">  25 cm → 28.1 cm</text><text x="150.00" y="82.10" font-size="2.8" text-anchor="start" fill="#222" font-weight="normal">  30 cm → 23.8 cm</text><text x="150.00" y="86.40" font-size="2.8" text-anchor="start" fill="#222" font-weight="normal">  35 cm → 17.4 cm</text><text x="150.00" y="90.70" font-size="2.8" text-anchor="start" fill="#222" font-weight="normal">  40 cm →  0.0 cm</text><text x="150.00" y="102.00" font-size="2.7" text-anchor="start" fill="#222" font-weight="normal">1. Punkte auf das OSB übertragen, mit einer</text><text x="150.00" y="106.00" font-size="2.7" text-anchor="start" fill="#222" font-weight="normal">   Latte zur Kurve verbinden, aussägen.</text><text x="150.00" y="110.00" font-size="2.7" text-anchor="start" fill="#222" font-weight="normal">2. Schablone so an die Achse schrauben, dass</text><text x="150.00" y="114.00" font-size="2.7" text-anchor="start" fill="#222" font-weight="normal">   ihre Unterkante den Boden gerade berührt.</text><text x="150.00" y="118.00" font-size="2.7" text-anchor="start" fill="#222" font-weight="normal">3. Feuchten Sand lagenweise andrücken,</text><text x="150.00" y="122.00" font-size="2.7" text-anchor="start" fill="#222" font-weight="normal">   Schablone ringsum drehen, Sand ergänzen.</text><text x="150.00" y="126.00" font-size="2.7" text-anchor="start" fill="#222" font-weight="normal">4. Mit nassem Zeitungspapier belegen.</text><text x="150.00" y="130.00" font-size="2.7" text-anchor="start" fill="#222" font-weight="normal">Sandmenge ca. 0.12 m³ (alter Bettungssand).</text><text x="5.00" y="10.00" font-size="4.4" text-anchor="start" fill="#222" font-weight="bold">SANDFORM-SCHABLONE  1:10</text><text x="5.00" y="15.20" font-size="2.8" text-anchor="start" fill="#555" font-weight="normal">Viertel-Ellipse = Innenform der Kuppel (Radius 40, Höhe 36) · die Schablone ist das Negativ</text></svg>