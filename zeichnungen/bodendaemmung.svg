ze="2.6" text-anchor="start" fill="#222" font-weight="normal">zur Plattenkante.</text><text x="170.00" y="42.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal"></text><text x="170.00" y="46.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">So zeichnet ihr den Kreis:</text><text x="170.00" y="50.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">Nagel in M (75 / 73.4),</text><text x="170.00" y="54.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">Schnur 51.4 cm + Bleistift.</text><text x="170.00" y="58.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal"></text><text x="170.00" y="62.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">Mischung 5 : 1 erdfeucht,</text><text x="170.00" y="66.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">nur andrücken, nicht stampfen.</text><text x="170.00" y="70.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">Oberfläche mit Brett</text><text x="170.00" y="74.00" font-size="2.6" text-anchor="start" fill="#222" font-weight="normal">auf den Rand abziehen.</text><text x="75.00" y="158.00" font-size="2.8" text-anchor="middle" fill="#8a3b12" font-weight="bold">▼ vorne</text><text x="-10.00" y="-16.00" font-size="4.4" text-anchor="start" fill="#222" font-weight="bold">BODENDÄMMUNG  1:20</text><text x="-10.00" y="-10.80" font-size="2.8" text-anchor="start" fill="#555" font-weight="normal">Draufsicht auf die Herdplatte (Betonwand oben)</text></svg>