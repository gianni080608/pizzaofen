">1 cm Fuge</text><line x1="179.20" y1="65.20" x2="268.80" y2="65.20" stroke="#7a3d1c" stroke-width="0.3" stroke-dasharray="1.5 1"/><text x="179.20" y="64.40" font-size="2.0" text-anchor="start" fill="#7a3d1c" font-weight="normal">Türlinie Kuppel y = 108</text><text x="175.00" y="52.60" font-size="2.3" text-anchor="start" fill="#7a3d1c" font-weight="normal">D1-Hinterkante y = 103 (trägt Reihe 3 über der Tür)</text><text x="169.00" y="30.00" font-size="3.0" text-anchor="start" fill="#222" font-weight="bold">DECKPLATTEN VON OBEN</text><text x="169.00" y="150.00" font-size="2.5" text-anchor="start" fill="#222" font-weight="normal">Halbkreis-Ausschnitt r = 7.75 cm in beide Platten</text><text x="169.00" y="154.00" font-size="2.5" text-anchor="start" fill="#222" font-weight="normal">(Winkelschleifer, mehrere flache Schnitte, dann</text><text x="169.00" y="158.00" font-size="2.5" text-anchor="start" fill="#222" font-weight="normal">ausbrechen). Rohr sitzt zwischen D1 und D2.</text><text x="169.00" y="162.00" font-size="2.5" text-anchor="start" fill="#222" font-weight="normal">Auflager: 5 cm je Seite auf den Tunnelwänden,</text><text x="169.00" y="166.00" font-size="2.5" text-anchor="start" fill="#222" font-weight="normal">D1 hinten zusätzlich auf Reihe 2 neben der Tür.</text><text x="169.00" y="170.00" font-size="2.5" text-anchor="start" fill="#222" font-weight="normal">Für ein Rohr Ø 150: Ausschnitt Ø 15.5.</text><text x="169.00" y="174.00" font-size="2.5" text-anchor="start" fill="#222" font-weight="normal">Euer Rohr aussen messen: Rohr-Ø + 5 mm.</text><text x="5.00" y="6.00" font-size="4.4" text-anchor="start" fill="#222" font-weight="bold">EINGANG, STURZ, DECKPLATTEN, KAMIN  1:10</text><text x="5.00" y="11.20" font-size="2.8" text-anchor="start" fill="#555" font-weight="normal">Tunnel 40 x 22.4 cm · Wände aus längs halbierten Schamottplatten</text></svg>